name: Deploy Backend to VM (dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/personalization-ml

            git pull origin dev

            source venv/bin/activate

            pip install -r requirements.txt

            pm2 restart backend || pm2 start "uvicorn main:app --host 0.0.0.0 --port 8000" --name backend
